<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Light Scheduler</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
</head>
<body>
    <header>
        <h1>Light Scheduler 💡</h1>
        <p>Set your ON and OFF times to automate your light</p>
    </header>

    <section>
        <form id="schedule-form" aria-label="Schedule Light Form">
            <div>
                <label for="on-time">🔵 ON Time</label>
                <input type="time" id="on-time" name="on-time" required aria-required="true"/>
            </div>
            <div>
                <label for="off-time">🔴 OFF Time</label>
                <input type="time" id="off-time" name="off-time" required aria-required="true"/>
            </div>
            <button type="submit">Schedule Light</button>
        </form>
        <p id="status" role="status" aria-live="polite">Not connected</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
